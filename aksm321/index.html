<script>
(function(){
var ORIG_IMG='shema-t12.jpg';
/* Модель пневмосистемы АКСМ 32100D. Давление — МПа изб., объём — л, «масса» n = p_abs·V.
   Цифры — из уроков Т 1.2–Т 1.13 (см. справку); где в материалах цифр нет — помечено «допущение». */
var ATM = 0.1;
var N = {};            // узлы-объёмы
var Q = {};            // потоки на рёбрах (для анимации), МПа·л/с
var S = {};            // органы управления и состояние
var E = {};            // электрика: катушки, контакты, лампы
var LOG = [];          // события для ленты

function node(id, V) { N[id] = { id: id, V: V, n: ATM * V }; }
function P(id) { return id === 'atm' ? 0 : N[id].n / N[id].V - ATM; }
function setP(id, p) { N[id].n = (p + ATM) * N[id].V; }
function vol(id) { return id === 'atm' ? 1e9 : N[id].V; }

/* поток a→b через проводимость G (л/с); ограничен, чтобы не перескочить выравнивание */
function flow(a, b, G, dt, key, oneway) {
  var pa = P(a), pb = P(b), d = pa - pb;
  if (oneway && d <= 0) return 0;
  if (Math.abs(d) < 1e-6) return 0;
  var dn = G * d * dt, Va = vol(a), Vb = vol(b), eq = d * Va * Vb / (Va + Vb);
  if (Math.abs(dn) > Math.abs(eq) * 0.7) dn = eq * 0.7;
  if (a !== 'atm') N[a].n -= dn;
  if (b !== 'atm') N[b].n += dn;
  if (key) Q[key] = (Q[key] || 0) + dn / dt;
  return dn;
}
/* следящий клапан: тянет выход к уставке от питания, лишнее — в атмосферу */
function follow(sup, out, target, G, dt, kIn, kEx) {
  var p = P(out), V = N[out].V, dn;
  if (p < target - 0.003) {
    var ps = P(sup), Vs = N[sup].V;
    dn = Math.min(G * Math.max(0, ps - p) * dt, (target - p) * V * 0.8, Math.max(0, ps - p) * Vs * V / (Vs + V) * 0.7);
    if (dn > 0) { N[sup].n -= dn; N[out].n += dn; if (kIn) Q[kIn] = (Q[kIn] || 0) + dn / dt; }
  } else if (p > target + 0.003) {
    dn = Math.min(G * p * dt, (p - target) * V * 0.8);
    N[out].n -= dn; if (kEx) Q[kEx] = (Q[kEx] || 0) + dn / dt;
  }
}
/* редуктор (КР, ФР, Ф1): выход держит уставку, не выше входа */
function reducer(sup, out, set, G, dt, key) {
  if (P(out) < set - 0.006) follow(sup, out, Math.min(set, P(sup)), G, dt, key, null);
  else if (P(out) > set + 0.03) flow(out, 'atm', G * 0.3, dt);
}
function ev(t) { LOG.unshift({ t: S.t, s: t }); if (LOG.length > 40) LOG.pop(); }

var KZC_NAME = { k21: 'Р4, задний тормозной контур', k22: 'Р5, передний тормозной контур', k23: 'Р6, стояночный контур', k24: 'Р7, подвеска и сиденье' };
var SET = {
  regOff: 0.80, regOn: 0.65,          // Т 1.4, Т 1.6.В: 8 и 6,5 кгс/см²
  safety: 0.90,                       // Т 1.5.Б: 9 кгс/см²
  kzo: 0.55,                          // Т 1.5.Е, Т 1.2
  k21: 0.645, k22: 0.645, k24: 0.655, k23: 0.695,   // Т 1.5.Д: 0,64–0,67 и 0,68–0,71
  kr: 0.375,                          // КР 0,35–0,4 (Т 1.2)
  fr: 0.575,                          // ФР двери 0,52–0,63 (Т 1.2, Т 1.6.Г)
  f1: 0.62,                           // Ф1 ПШУ 0,59–0,65 (Т 1.6.Г)
  springRel: 0.51,                    // энергоаккумулятор растормаживается при 510 кПа (Т 1.8.А)
  dad: 0.55,                          // ДАД: порог — допущение (в материалах не указан)
  dad1: 0.45,                         // ДАД1 стояночного — допущение
  vpst: 0.01,                         // ВПСТ 0,1 кгс/см² (Т 1.2)

function initModel() {

  node('cu', 1.2); node('dry', 1.0); node('r1', 6); node('sup', 27);
  node('r3', 40); node('r4', 40); node('r5', 40); node('r6', 25); node('r7', 40);
  node('ktu', 0.3); node('ktl', 0.6); node('tk1', 1.2); node('tk2', 1.2);
  node('kr', 0.3); node('ke', 0.2); node('km', 0.2); node('kd2', 0.2); node('kd1', 0.2);
  node('ku1', 0.5); node('ta1s', 1.2); node('ta2s', 1.2);
  node('ktr', 0.3); node('kd3', 0.2); node('spr', 3.0);
  node('fr', 1.0); node('pshu', 1.0); node('seat', 2.0);
  var i;
  for (i = 1; i <= 6; i++) node('pe' + i, 6);
  for (i = 1; i <= 3; i++) { node('d' + i + 'i', 0.3); node('d' + i + 'o', 2.0); node('d' + i + 'c', 2.0); }
  S = {
    t: 0, speed: 4, paused: false,

    pedal: 0, ktr: 1,                 // КТР: 0 — вперёд (отпущен), 1 — назад (заторможен)
    sa1: true, lowSpeed: false,
    doors: [mkDoor(), mkDoor(), mkDoor()],
    load: 0.3, kneel: false, seatCmd: 0, seatSet: 0.32,
    leaks: { sup: 0, r3: 0, r4: 0, r5: 0, r6: 0, r7: 0, spr: 0 },
    absSkid: '', asrSlip: '', absPhase: 0, absT: 0,
    k: { k21: false, k22: false, k23: false, k24: false, kzo: false },
    pshu: { on: true, mode: 'line', step: '', t: 0, L: { h: 1, yaw: 1, fix: false }, R: { h: 1, yaw: 1, fix: false },
            hooks: false, push: false, y: [false, false, false, false, false, false, false], dewire: false }
  };
  setP('pe1', 0.35); setP('pe2', 0.35); setP('pe3', 0.35); setP('pe4', 0.35); setP('pe5', 0.30); setP('pe6', 0.30);

function mkDoor() { return { cmd: 'close', x: 0, emIn: false, emOut: false, hand: false }; }

/* полностью накачанная система — кнопка «Накачать» */
function pumpUp() {
  var ids = ['cu', 'dry', 'r1', 'sup', 'r3', 'r4', 'r5', 'r6', 'r7'], i;
  for (i = 0; i < ids.length; i++) setP(ids[i], 0.79);
  setP('cu', 0.0); setP('dry', 0.0);
  setP('fr', SET.fr); setP('pshu', SET.f1); setP('kr', SET.kr);
  for (i = 1; i <= 3; i++) { setP('d' + i + 'i', SET.fr); setP('d' + i + 'c', SET.fr); }
  S.regClosed = false; S.k.k21 = S.k.k22 = S.k.k23 = S.k.k24 = S.k.kzo = true;
  ev('Система накачана до 0,79 МПа');
}
function dumpAll() {
  for (var id in N) setP(id, 0);
  S.regClosed = true; S.k.k21 = S.k.k22 = S.k.k23 = S.k.k24 = S.k.kzo = false;
  ev('Воздух стравлен из всех контуров');
}

function stepModel(dt) {
  Q = {};
  S.t += dt;
  var p, i;

  /* ---------- электрика: компрессор и регулятор (ДД) ---------- */
  var pReg = P('sup');
  if (S.regClosed && pReg >= SET.regOff && !S.regFail) { S.regClosed = false; S.purge = 12; S.kask = 2; ev('ДД: 0,8 МПа — компрессор выключен, осушитель продувается'); }
  if (!S.regClosed && pReg <= SET.regOn) { S.regClosed = true; ev('ДД: 0,65 МПа — компрессор включён'); }
  var was = S.comp;
  E.kmk = S.power24 && S.avComp && S.regClosed;          // катушка контактора компрессора
  S.comp = E.kmk && S.kc600;                              // двигатель: нужно 380 В от преобразователя (600 В КС)
  if (was && !S.comp) { S.kask = Math.max(S.kask, 2); }
  if (S.comp) {
    p = P('cu');
    if (p < 1.0) { N.cu.n += 0.85 * (1 - p / 2) * dt; Q.comp = 0.85; }
  }
  /* предохранительный клапан КУ */
  if (P('cu') > SET.safety) { flow('cu', 'atm', 30, dt, 'safety'); E.safety = true; } else E.safety = false;
  /* буксировка: КО */
  if (S.tug) { N.tug = N.tug || { id: 'tug', V: 1e6, n: 0.85e6 }; flow('tug', 'cu', 3, dt, 'tug', true); }
  /* МО → ВО → (Р1) → Р2 */
  flow('cu', 'dry', 14, dt, 'cu_dry', true);
  flow('dry', 'r1', 2.5, dt, 'dry_r1');
  flow('dry', 'sup', 14, dt, 'dry_sup', true);               // обратный клапан осушителя
  if (S.purge > 0) {                                          // регенерация: Р1 через патрон в атмосферу
    S.purge -= dt; flow('dry', 'atm', 6, dt, 'purge'); flow('cu', 'atm', 6, dt, 'purge');
    if (S.purge <= 0) S.purge = 0;
  }
  if (S.kask > 0) { S.kask -= dt; flow('cu', 'atm', 4, dt, 'kask'); }
  /* КЗЧ (Т 1.5.Д) и КЗО (Т 1.5.Е): перепускные клапаны — держат давление на входе не ниже уставки,
     избыток пропускают в контур; накачанный контур открыт в обе стороны до уставки.
     Выводы 21 и 22 ещё наполняются через дроссель с обратным клапаном — первыми. */
  var k = S.k, pin = P('sup');
  var outs = [['k21', 'r4', SET.k21, true], ['k22', 'r5', SET.k22, true], ['k24', 'r7', SET.k24, false], ['k23', 'r6', SET.k23, false], ['kzo', 'r3', SET.kzo, false]];
  for (i = 0; i < outs.length; i++) {
    var o = outs[i], nm = o[0], set = o[2], po = P(o[1]), key = (nm === 'kzo' ? 'kzo_' : 'kzc_') + o[1];
    var full = pin >= set - 0.005 && po >= set - 0.005, a = Math.max(0, Math.min(1, (pin - set) / 0.02));
    if (full) flow('sup', o[1], 9, dt, key);
    else if (a > 0) flow('sup', o[1], 9 * a, dt, key, true);
    if (o[3]) flow('sup', o[1], 1.2, dt, key, true);
    if (!k[nm] && pin >= set) { k[nm] = true; ev(nm === 'kzo' ? 'КЗО открылся (0,55 МПа) — наполняется дверной контур Р3' : 'КЗЧ: открылся вывод ' + nm.slice(1) + ' (' + set.toFixed(2).replace('.', ',') + ' МПа) — ' + KZC_NAME[nm]); }
    else if (k[nm] && !full && pin < set - 0.02) { k[nm] = false; ev(nm === 'kzo' ? 'КЗО закрылся — дверной контур отсечён' : 'КЗЧ: закрылся вывод ' + nm.slice(1) + ' — ' + KZC_NAME[nm] + ' отсечён'); }
  }

  /* утечки */
  var LK = { sup: 'sup', r3: 'r3', r4: 'r4', r5: 'r5', r6: 'r6', r7: 'r7', spr: 'spr' };
  for (var lk in LK) if (S.leaks[lk]) flow(LK[lk], 'atm', S.leaks[lk] === 2 ? 3 : 0.06, dt, 'leak_' + lk);

  /* ---------- рабочий тормоз: КТ ---------- */
  var tgt = S.pedal * SET.pedalMax;
  follow('r4', 'ktu', Math.min(tgt, P('r4')), 6, dt, 'kt_u', 'kt_ex');
  follow('r5', 'ktl', Math.min(tgt, P('r5')), 6, dt, 'kt_l', 'kt_ex');
  /* остановочный тормоз: КЭ, КР; ASR: КМ */
  var doorsOpen = false;
  for (i = 0; i < 3; i++) if (S.doors[i].x > 0.03) doorsOpen = true;
  E.vpstDoors = doorsOpen;
  E.ke = S.power24 && S.sa1 && (doorsOpen || S.lowSpeed);
  reducer('r3', 'kr', SET.kr, 4, dt, 'r3_kr');
  if (E.ke) flow('kr', 'ke', 6, dt, 'kr_ke'); else flow('ke', 'atm', 6, dt, 'ke_ex');
  E.km = S.power24 && !!S.asrSlip;
  if (E.km) flow('r6', 'km', 5, dt, 'r6_km'); else flow('km', 'atm', 5, dt, 'km_ex');
  /* КД2 и КД1 — «ИЛИ» */
  if (P('ke') >= P('km')) flow('ke', 'kd2', 8, dt, 'ke_kd2'); else flow('km', 'kd2', 8, dt, 'km_kd2');
  if (P('ktu') >= P('kd2')) flow('ktu', 'kd1', 8, dt, 'ktu_kd1'); else flow('kd2', 'kd1', 8, dt, 'kd2_kd1');
  /* КУ1 */
  follow('r4', 'ku1', Math.min(P('kd1'), P('r4')), 10, dt, 'r4_ku1', 'ku1_ex');

  /* ---------- модуляторы АБС ---------- */
  S.absT += dt;
  if (S.absT > 0.45) { S.absT = 0; S.absPhase = (S.absPhase + 1) % 3; }   // 0 подача, 1 удержание, 2 сброс (замедлено для наглядности)
  var MD = [['md1', 'ku1', 'ta1s'], ['md2', 'ku1', 'ta2s'], ['md3', 'ktl', 'tk1'], ['md4', 'ktl', 'tk2']];
  for (i = 0; i < MD.length; i++) {
    var m = MD[i], mode = 'pass';
    var wheel = { md1: 'ТА1', md2: 'ТА2', md3: 'ТК1', md4: 'ТК2' }[m[0]];
    if (S.power24 && S.absSkid === wheel && P(m[2]) > 0.05) mode = ['pass', 'hold', 'rel'][S.absPhase];
    if (S.power24 && S.asrSlip && (m[0] === 'md1' || m[0] === 'md2')) mode = (S.asrSlip === wheel) ? 'pass' : 'hold';
    E[m[0]] = mode;
    if (mode === 'pass') flow(m[1], m[2], 8, dt, m[0]);
    else if (mode === 'rel') flow(m[2], 'atm', 8, dt, m[0] + '_ex');
  }

  /* ---------- стояночный тормоз: КТР, КД3, КУ2 ---------- */
  var ktrT = (1 - S.ktr) * P('r6');
  if (S.ktr <= 0.001) flow('r6', 'ktr', 6, dt, 'r6_ktr');
  else if (S.ktr >= 0.999) flow('ktr', 'atm', 6, dt, 'ktr_ex');
  else follow('r6', 'ktr', ktrT, 6, dt, 'r6_ktr', 'ktr_ex');
  E.vpstPark = P('ktr') > SET.vpst;
  if (P('ktr') >= P('ku1')) flow('ktr', 'kd3', 8, dt, 'ktr_kd3'); else flow('ku1', 'kd3', 8, dt, 'ku1_kd3');
  follow('r6', 'spr', Math.min(P('kd3'), P('r6')), 10, dt, 'r6_spr', 'spr_ex');

  /* ---------- двери ---------- */
  reducer('r3', 'fr', SET.fr, 6, dt, 'r3_fr');
  for (i = 0; i < 3; i++) {
    var d = S.doors[i], di = 'd' + (i + 1) + 'i', dop = 'd' + (i + 1) + 'o', dcl = 'd' + (i + 1) + 'c';
    var em = d.emIn || d.emOut;
    if (em) { flow(di, 'atm', 6, dt, di + '_ex'); flow(dop, 'atm', 4, dt); flow(dcl, 'atm', 4, dt); }
    else {
      flow('fr', di, 6, dt, 'fr_' + di);
      if (d.cmd === 'open') { flow(di, dop, 4, dt, di + '_o'); flow(dcl, 'atm', 4, dt, dcl + '_ex'); }
      else { flow(di, dcl, 4, dt, di + '_c'); flow(dop, 'atm', 4, dt, dop + '_ex'); }
    }
    var f = P(dop) - P(dcl);
    if (f > 0.12 && d.x < 1) d.x = Math.min(1, d.x + dt * 0.7 * Math.min(1, f / 0.4));
    else if (f < -0.12 && d.x > 0) d.x = Math.max(0, d.x - dt * 0.7 * Math.min(1, -f / 0.4));
    if (em && d.hand) d.x = Math.min(1, d.x + dt * 0.5);
  }

  /* ---------- подвеска (ECAS) и сиденье ---------- */
  var pt = [0.30 + 0.30 * S.load, 0.30 + 0.30 * S.load, 0.30 + 0.30 * S.load, 0.30 + 0.30 * S.load, 0.24 + 0.22 * S.load, 0.24 + 0.22 * S.load];
  E.ecas = S.power24;
  for (i = 1; i <= 6; i++) {
    var id = 'pe' + i, h = Math.max(0, Math.min(1, 0.5 + (P(id) - pt[i - 1]) / 0.25));
    S['h' + i] = h;
    var want = 0.5;
    if (S.kneel && (i === 3 || i === 4 || i === 6)) want = 0.12;     // наклон на правый борт — двери снизу схемы (допущение)
    var src = i <= 4 ? 'kz' : 'kp';
    if (!E.ecas) continue;
    if (h < want - 0.03) flow('r7', id, 1.4, dt, src + '_' + id, true);
    else if (h > want + 0.03) flow(id, 'atm', 1.4, dt, id + '_ex');
  }
  if (S.seatCmd > 0) flow('r7', 'seat', 1.0, dt, 'r7_seat', true);
  else if (S.seatCmd < 0) flow('seat', 'atm', 1.0, dt, 'seat_ex');
  else if (P('seat') < S.seatSet - 0.01) flow('r7', 'seat', 1.0, dt, 'r7_seat', true);
  if (S.seatCmd !== 0) S.seatSet = P('seat');

  /* ---------- ПШУ ---------- */
  reducer('r3', 'pshu', SET.f1, 3, dt, 'r3_pshu');
  stepPSHU(dt);

  /* ---------- датчики, лампы ---------- */
  E.dad2 = P('r4') < SET.dad; E.dad3 = P('r5') < SET.dad; E.dad4 = P('r7') < SET.dad;
  E.dad1 = P('spr') < SET.dad1;
  E.buzz = S.power24 && (E.dad2 || E.dad3 || E.dad4);
  E.stopLamp = P('ktu') > SET.vpst || P('ktl') > SET.vpst;
}

/* ПШУ: алгоритм из Т 1.2 (режимы опускания, подъёма, работа от сети) */
function stepPSHU(dt) {
  var s = S.pshu, ok = S.power24 && s.on, cmd = s.y, i;
  var L = s.L, R = s.R, sp = dt * 0.35;
  function yset(list, v) { for (var j = 0; j < list.length; j++) { if (cmd[list[j]] !== v) { cmd[list[j]] = v; if (v) N.pshu.n -= 0.012; } } }
  s.t += dt;
  if (!ok) { for (i = 1; i <= 6; i++) cmd[i] = false; }
  /* исполнительные цилиндры по распределителям: работают, только если есть воздух после Ф1 */
  var air = P('pshu') > 0.3, y = [];
  for (i = 0; i <= 6; i++) y[i] = cmd[i] && air;
  function pole(p, low, push) {
    if (!air) return;
    if (y[4] && push) { p.h = Math.max(0, p.h - sp * 1.2); }               // Ц2/Ц6 — дожим вниз
    else if (s.mode === 'raise' && (s.step === 'c' || s.step === 'd')) { p.h = Math.min(0.06, p.h + sp * 0.5); }  // Ц2/Ц6 отпустили — штанги приподнялись с крюков
    else if ((y[2] || y[3]) && low) { if (p.h > low) p.h = Math.max(low, p.h - sp); }   // Ц1/Ц5 — опускание
    else if (!y[2] && !y[3] && s.mode === 'raise2') { p.h = Math.min(1, p.h + sp * 0.8); }  // штанга поднимается пружинами
    if (y[6]) p.yaw = Math.max(0, p.yaw - dt * 0.8);                         // Ц9/Ц10 — выравнивание
    else if (s.mode === 'raise2' || s.mode === 'line') p.yaw = Math.min(1, p.yaw + dt * 0.2);
    p.fix = !!y[1] && p.yaw < 0.05;                                          // Ц3/Ц7 — фиксация
  }
  var D = s.D = {};
  pole(L, s.mode === 'dewire' ? 0.35 : 0.08, true); pole(R, s.mode === 'dewire' ? 0.35 : 0.08, true);
  if (air) s.hooks = !!cmd[5];
  D.d1 = L.h <= 0.09; D.d5 = R.h <= 0.09; D.d3 = L.h <= 0.01; D.d7 = R.h <= 0.01;
  D.d11 = L.yaw < 0.05; D.d12 = R.yaw < 0.05; D.d4 = L.fix; D.d8 = R.fix;
  D.d9 = s.hooks; D.d10 = !s.hooks; D.d2 = L.h >= 0.99; D.d6 = R.h >= 0.99;
  if (!ok || !air) return;
  switch (s.mode) {
    case 'lower':                                     // режим опускания
      if (s.step === '') { yset([2, 3, 6], true); s.step = 'a'; }
      if (s.step === 'a' && D.d11 && D.d12) { yset([1], true); s.step = 'b'; }
      if (s.step === 'b' && D.d1 && D.d5) { yset([5], true); s.step = 'c'; }
      if (s.step === 'c' && D.d9) { yset([4], true); s.step = 'd'; }
      if (s.step === 'd' && D.d3 && D.d7) { yset([5], false); s.step = 'e'; }
      if (s.step === 'e' && D.d10) { yset([4], false); s.step = 'f'; s.t = 0; }
      if (s.step === 'f' && s.t > 0.6) { yset([1, 2, 3, 5, 6], false); s.mode = 'stowed'; s.step = ''; ev('ПШУ: штанги уложены под крюки'); }
      break;
    case 'raise':                                     // режим подъёма
      if (s.step === '') { yset([1, 2, 3, 4, 6], true); s.step = 'a'; }
      if (s.step === 'a' && D.d3 && D.d7) { yset([5], true); s.step = 'b'; }
      if (s.step === 'b' && D.d9) { yset([4], false); s.step = 'c'; }
      if (s.step === 'c' && !D.d3 && !D.d7) { s.step = 'd'; s.t = 0; }               // пропал сигнал Д3, Д7
      if (s.step === 'd' && s.t > 2.5) { yset([1, 2, 3, 5], false); s.mode = 'raise2'; s.step = 'e'; s.t = 0; }  // через 2–3 с
      break;
    case 'raise2':
      if (s.step === 'e' && s.t > 5) { yset([6], false); s.step = ''; s.mode = 'line'; ev('ПШУ: штанги на проводах, режим питания от сети'); }  // через 5 с
      break;
    case 'dewire':                                    // сход штанги в режиме питания от сети
      if (s.step === '') { yset([1, 2, 3, 6], true); s.step = 'a'; ev('ПШУ: сход штанги — опускание до 600 мм, выравнивание, фиксация'); }
      break;
  }
}

  var LK = [['sup', 'Утечка: питающая'], ['r4', 'Утечка: Р4 задний'], ['r5', 'Утечка: Р5 передний'], ['r6', 'Утечка: Р6 стояночный'], ['spr', 'Утечка: энергоаккум.'], ['r7', 'Утечка: Р7 подвеска'], ['r3', 'Утечка: Р3 двери']];
  each(LK, function (l) { mkCycle(g, l[1], [0, 1, 2], ['нет', 'малая', 'обрыв'], function () { return S.leaks[l[0]]; }, function (v) { S.leaks[l[0]] = v; }, true); });
  mkTg(g, 'Отказ регулятора ДД', function () { return S.regFail; }, function (v) { S.regFail = v; }, true);
  mkCycle(g, 'Юз колеса (АБС)', ['', 'ТК1', 'ТК2', 'ТА1', 'ТА2'], ['нет', 'ТК1', 'ТК2', 'ТА1', 'ТА2'], function () { return S.absSkid; }, function (v) { S.absSkid = v; }, true);
  mkCycle(g, 'Буксует колесо (ASR)', ['', 'ТА1', 'ТА2'], ['нет', 'ТА1', 'ТА2'], function () { return S.asrSlip; }, function (v) { S.asrSlip = v; }, true);
  mkTg(g, 'Тягач на буксирном клапане', function () { return S.tug; }, function (v) { S.tug = v; });
  h('div', 'note', side, 'Цвет трубы — контур, как в лекции; тусклая — нет воздуха, белые точки — воздух идёт. Цифры в ресиверах — давление, МПа. Тапни по аппарату — назначение и состояние; у блоков с рамкой есть увеличенная схема. «Манометр» — тапни по любой трубе. Цифры и пороги — из уроков Т 1.2–Т 1.13; где их нет, взяты допущения (см. «Справку»).');

  var tabs = [['main', 'Пневмосхема'], ['pshu', 'ПШУ (ТПП)'], ['elec', 'Электрика'], ['img', 'Схема из лекции']];

}
function pshuCmd(m) {

}

  $('bVM').className = 'tb' + (UI.vm ? ' on' : ''); $('bAn').className = 'tb' + (UI.anim ? ' on' : ''); $('bSum').className = 'tb' + (UI.sum ? ' on' : '');
  each($('tabs').childNodes, function (b) { b.className = 'tb tab' + (b._id === UI.sheet ? ' on' : ''); });
}
function toast(t) { var e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(UI.tt); UI.tt = setTimeout(function () { e.style.display = 'none'; }, 2600); }

/* листы и масштаб */
function setSheet(id) {

  applyDash(); fitZ(); syncUI();
}
function applyDash() { $('dash').style.display = UI.dash && UI.sheet === 'main' ? '' : 'none'; $('bDash').className = 'tb' + (UI.dash ? ' on' : ''); }
function curSvg() { return $('sh_' + UI.sheet); }
function setZ(z) {

  var e = curSvg(); if (!e) return;

  var vb = SHEETS[UI.sheet]; e.setAttribute('width', Math.round(vb[2] * UI.z)); e.setAttribute('height', Math.round(vb[3] * UI.z));
}
function fitZ() {

}
/* на узком экране первый тап увеличивает схему вокруг пальца */
function zoomAt(e, z) {

}
function smallZ() { return UI.z < 0.6 && !UI.vm; }

/* тап по схеме */
function onTap(e) {

  if (elId) showInfo(elId); else if (pipe) showPipe(pipe);
}
function showInfo(id) {

/* справка и сводка */
function showRef() {

  var a = [['Компрессор', S.comp], ['Продувка ВО', S.purge > 0], ['КЗЧ 21', S.k.k21], ['КЗЧ 22', S.k.k22], ['КЗЧ 23', S.k.k23], ['КЗЧ 24', S.k.k24], ['КЗО', S.k.kzo], ['КЭ', E.ke], ['КМ', E.km], ['ДАД1', E.dad1], ['ДАД2', E.dad2], ['ДАД3', E.dad3], ['ДАД4', E.dad4], ['Зуммер', E.buzz], ['Двери откр.', E.vpstDoors], ['Предохр. кл.', E.safety]];
  s = ''; each(a, function (x) { s += '<span class="dev' + (x[1] ? ' on' : '') + '">' + x[0] + '</span>'; });
  $('devs').innerHTML = s;
  s = ''; each(LOG.slice(0, 14), function (l) { s += '<div class="log"><span>' + tmin(l.t) + '</span> ' + l.s + '</div>'; });

function tmin(t) { var m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + (s < 10 ? '0' : '') + s; }

/* приборы: два двухстрелочных манометра и лампы */
var GA = {};
function buildDash() {

  function gauge(id, title, a, b, lampKey) {
    var w = h('div', 'gauge', d), s = el('svg', { viewBox: '0 0 120 84', width: 120, height: 84 }, null);
    w.appendChild(s);

    for (var i = 0; i <= 10; i++) { var an = Math.PI * (1 - i / 10), x = 60 + Math.cos(an) * 48, y = 70 - Math.sin(an) * 48, x2 = 60 + Math.cos(an) * (i % 2 ? 43 : 40), y2 = 70 - Math.sin(an) * (i % 2 ? 43 : 40); el('line', { x1: x, y1: y, x2: x2, y2: y2, 'class': 'gt' }, s); if (i % 2 === 0) el('text', { x: 60 + Math.cos(an) * 32, y: 73 - Math.sin(an) * 32, 'class': 'gn', 'text-anchor': 'middle' }, s, i); }
    var n1 = el('line', { x1: 60, y1: 70, x2: 60, y2: 26, 'class': 'nd1' }, s), n2 = el('line', { x1: 60, y1: 70, x2: 60, y2: 30, 'class': 'nd2' }, s);

  }

}

  l.stop.className = 'lp' + (P('ta1s') > 0.05 && E.ke ? ' yel' : '');
  l.doors.className = 'lp' + (S.power24 && E.vpstDoors ? ' yel' : '');
  l.low.className = 'lp' + (E.buzz ? ' red' : '');
  l.comp.className = 'lp' + (S.comp ? ' grn' : '');
  l.abs.className = 'lp' + (S.power24 && (E.md1 !== 'pass' || E.md2 !== 'pass' || E.md3 !== 'pass' || E.md4 !== 'pass') ? ' yel' : '');
  l.susp.className = 'lp' + (S.power24 && E.dad4 ? ' red' : '');
}
function status() {
  var br = Math.max(P('ta1s'), P('tk1')), sp = P('spr'), can = sp >= SET.springRel && br < 0.03;
  $('status').textContent = (S.paused ? 'Пауза' : '×' + S.speed) + ' · ' + tmin(S.t) + ' · Р2 ' + fmt(P('sup')) + ' МПа · ' + (S.comp ? 'компрессор работает' : 'компрессор стоит') + ' · ' + (can ? 'можно ехать' : sp < SET.springRel ? 'заторможен пружинами' : 'заторможен');
}

/* главный цикл */
function tick() {
  if (!S.paused) {
    var dt = 0.05 * S.speed, n = Math.ceil(dt / 0.02), i;
    for (i = 0; i < n; i++) stepModel(dt / n);
  }
  if (UI.sheet === 'main') paintMain(UI.anim);
  else if (UI.sheet === 'pshu') paintPSHU(UI.anim);
  else if (UI.sheet === 'elec') paintElec();

}
function start() {

  var m = el('svg', { id: 'sh_main', 'class': 'sheet', viewBox: SHEETS.main.join(' ') }, $('view')); buildMain(m); m.addEventListener('click', onTap);
  var p = el('svg', { id: 'sh_pshu', 'class': 'sheet', viewBox: SHEETS.pshu.join(' ') }, $('view')); buildPSHU(p);
  var e = el('svg', { id: 'sh_elec', 'class': 'sheet', viewBox: SHEETS.elec.join(' ') }, $('view')); buildElec(e);
  e.addEventListener('click', function (ev) { if (smallZ()) zoomAt(ev, 0.85); });
  var im = h('img', 'orig', $('view')); im.id = 'sh_img'; im.alt = 'Пневмосхема АКСМ 32100D из урока Т 1.2'; im.src = ORIG_IMG;
  el('svg', { id: 'zsvg', viewBox: '0 0 ' + ZW + ' ' + ZH }, $('zbody'));
  buildUI(); buildDash();
  setSheet('main'); syncUI();
  window.addEventListener('resize', function () { fitZ(); });
  setInterval(tick, 50);
  toast(smallZ() ? 'Тапни по схеме — она увеличится. Система пустая, компрессор качает; «Накачать» — сразу 0,79 МПа' : 'Система пустая — компрессор качает. Смотри порядок наполнения; «Накачать» — сразу 0,79 МПа');
  $('bDash').onclick = function () { UI.dash = !UI.dash; if (UI.dash && UI.sheet !== 'main') setSheet('main'); else { applyDash(); fitZ(); } };
}

window.TB={st:function(){return {S:S,E:E,N:N,Q:Q,LOG:LOG,UI:UI};},P:P,step:stepModel,pumpUp:pumpUp,dumpAll:dumpAll,openZoom:openZoom,closeZoom:closeZoom,setSheet:setSheet,ZOOM:ZOOM,pshuCmd:pshuCmd,showInfo:showInfo,showPipe:showPipe,showRef:showRef,ELS:ELS,PIPES:PIPES,SET:SET,syncUI:syncUI,tick:tick,initModel:initModel};
start();
})();
